    <!-- Suppress external browser extension unhandled rejections (e.g. MetaMask inpage.js) -->
    <script>
      (function() {
        var isExtensionError = function(err) {
          if (!err) return false;
          var str = (err.message || '') + ' ' + (err.stack || '') + ' ' + (err.reason || '') + ' ' + String(err);
          return str.includes('MetaMask') || str.includes('nkbihfbeogaeaoehlefnkodbefgpgknn') ||
                 str.includes('chrome-extension://') || str.includes('moz-extension://') ||
                 str.includes('Failed to connect to MetaMask');
        };
        window.addEventListener('error', function(e) {
          if (isExtensionError(e.error) || (e.filename && isExtensionError(e.filename))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isExtensionError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
