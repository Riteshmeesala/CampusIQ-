services:
  # ── CampusIQ+ API Gateway Web Service on Render ──
  - type: web
    name: campusiq-gateway
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_URL
        sync: false # Set to your Vercel URL, e.g. https://your-campusiq-app.vercel.app
      - key: EUREKA_SERVER_URL
        sync: false # Optional: Set to your Eureka server URL if deployed
      - key: AUTH_SERVICE_URL
        sync: false # Optional: Direct HTTPS URL to Auth Service on Render
      - key: ACADEMIC_SERVICE_URL
        sync: false # Optional: Direct HTTPS URL to Academic Service on Render
      - key: ASSESSMENT_SERVICE_URL
        sync: false # Optional: Direct HTTPS URL to Assessment Service on Render
      - key: FINANCE_SERVICE_URL
        sync: false # Optional: Direct HTTPS URL to Finance Service on Render
      - key: CAMPUS_AI_SERVICE_URL
        sync: false # Optional: Direct HTTPS URL to Campus AI Service on Render
