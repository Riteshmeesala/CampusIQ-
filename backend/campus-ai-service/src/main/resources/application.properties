spring.application.name=campus-ai-service
server.port=${PORT:${CAMPUS_AI_SERVICE_PORT:8086}}
server.servlet.context-path=/api

# Database Configuration (Supports Aiven MySQL, Cloud PostgreSQL, and local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusiq_v6}?useSSL=${DB_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & JWT
app.jwt.secret=${JWT_SECRET:CampusIQPlusSecretKey2024SuperSecureJWTSigningKey256BitsOrMoreForHMACSHA}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# Grok AI Configuration (xAI / Groq)
# ==========================================
grok.api-key=${GROQ_API_KEY:${OPENAI_API_KEY:${XAI_API_KEY:${GROK_API_KEY:}}}}
grok.model=${GROQ_MODEL:${OPENAI_MODEL:${GROK_MODEL:qwen/qwen3.8-27b}}}
grok.base-url=${GROQ_BASE_URL:${GROK_BASE_URL:https://api.groq.com/openai/v1}}
grok.timeout-seconds=30

app.cors.allowed-origins=${CORS_ORIGINS:${FRONTEND_URL:http://localhost:3000,http://localhost:4200,http://localhost:8080}}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=health,info
