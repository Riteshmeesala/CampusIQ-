spring.application.name=campus-ai-service
server.port=8085
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/campusiq_v6?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:CampusIQPlusSecretKey2024SuperSecureJWTSigningKey256BitsOrMoreForHMACSHA}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# Grok AI Configuration (xAI / Groq)
# ==========================================
grok.api-key=${XAI_API_KEY:${GROK_API_KEY:}}
grok.model=${GROK_MODEL:grok-beta}
grok.base-url=${GROK_BASE_URL:https://api.x.ai/v1}
grok.timeout-seconds=30

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=health,info
